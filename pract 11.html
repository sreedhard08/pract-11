<!DOCTYPE html> 
<html> 
<head> 
    <title>Cake Shop</title> 
 
    <style> 
        body { 
            font-family: Arial, sans-serif; 
            margin: 10px 3%; 
            text-align: center; 
        } 
 
        h2 { 
            background-color: red; 
            color: white; 
            padding: 5px; 
            font-size: 16px; 
            margin-bottom: 2px; 
        } 
 
        /* Cake Gallery */ 
        .cake-container { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 15px; 
            margin-top: 2px; 
        } 
 
        .cake img { 
            width: 100%; 
            height: 140px; 
            object-fit: cover; 
        } 
 
        .cake p { 
            font-size: 10px; 
            margin-top: 2px; 
        } 
 
        /* Order Section */ 
        h3 { 
            color: royalblue; 
            margin-bottom: 5px; 
        } 
 
        .order { 
            width: 55%; 
            margin: auto; 
            text-align: left; 
        } 
 
        label { 
            display: block; 
            color: blue; 
            font-size: 10px; 
            font-weight: bold; 
            margin-top: 5px; 
        } 
 
        input { 
            width: 100%; 
            padding: 4px; 
            box-sizing: border-box; 
            margin-top: 3px; 
        } 
 
        button { 
            display: block; 
            width: 50%; 
            margin: 3px auto; 
            padding: 5px; 
            background-color: #087bfa; 
            color: white; 
            border: none; 
            cursor: pointer; 
        } 
 
        button:hover { 
            background-color: darkblue; 
        } 
 
        hr { 
            border: 1px solid blue; 
            margin-top: 8px; 
        } 
 
        h4 { 
            color: forestgreen; 
            margin: 8px; 
        } 
 
        /* Bill */ 
        .bill { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 10px; 
        } 
 
        .total { 
            background-color: #28a745; 
            color: white; 
            width: 28%; 
            padding: 2px; 
        } 
 
        #price { 
            color: red; 
            font-size: 18px; 
        } 
 
        /* Responsive Design */ 
        @media (max-width: 768px) { 
            .cake-container { 
                grid-template-columns: repeat(2, 1fr); 
            } 
 
            .order { 
                width: 80%; 
            } 
        } 
 
        @media (max-width: 480px) { 
            .cake-container { 
                grid-template-columns: 1fr; 
            } 
 
            .order { 
                width: 95%; 
            } 
 
            .cake img { 
                height: 180px; 
            } 
        } 
 
    </style> 
</head> 
 
<body> 
 
    <h2>CAKE SHOP</h2> 
 
    <!-- Cake Images --> 
    <div class="cake-container"> 
 
        <div class="cake"> 
            <img src="cake1.jpg" alt="Color Cake"> 
            <p>Color Cake – Rs. 300</p> 
        </div> 
 
        <div class="cake"> 
            <img src="cake2.jpg" alt="Brown Cake"> 
            <p>Brown Cake – Rs. 200</p> 
        </div> 
 
        <div class="cake"> 
            <img src="cake3.jpg" alt="Milky Cake"> 
            <p>Milky Cake – Rs. 250</p> 
        </div> 
 
        <div class="cake"> 
            <img src="cake4.jpg" alt="Black Forest Cake"> 
            <p>Black Forest Cake – Rs. 350</p> 
        </div> 
 
    </div> 
 
    <h3>Order Cake</h3> 
 
    <!-- Order Form --> 
    <div class="order"> 
 
        <label>Color Cake(Quantity)</label> 
        <input type="number" id="q1" value="2" min="0"> 
 
        <label>Brown Cake(Quantity)</label> 
        <input type="number" id="q2" value="1" min="0"> 
 
        <label>Milky Cake(Quantity)</label> 
        <input type="number" id="q3" value="2" min="0"> 
 
        <label>Black Forest Cake(Quantity)</label> 
        <input type="number" id="q4" value="1" min="0"> 
 
        <button onclick="placeOrder()">Place Order</button> 
 
    </div> 
 
    <hr> 
 
    <h4>Purchase Order Bill!!!</h4> 
 
    <div class="bill"> 
        <div class="total"> 
            Total Price 
        </div> 
 
        <h3 id="price">Rs.1650</h3> 
    </div> 
 
    <script> 
 
        function placeOrder() { 
 
            let color = Number(document.getElementById("q1").value); 
            let brown = Number(document.getElementById("q2").value); 
            let milky = Number(document.getElementById("q3").value); 
            let black = Number(document.getElementById("q4").value); 
 
            if (color < 0 || brown < 0 || milky < 0 || black < 0 || 
                !Number.isInteger(color) || !Number.isInteger(brown) || 
                !Number.isInteger(milky) || !Number.isInteger(black)) { 
 
                alert("Please enter valid quantities!"); 
                return; 
            } 
 
            let total = (color * 300) + 
                        (brown * 200) + 
                        (milky * 250) + 
                        (black * 350); 
 
            document.getElementById("price").innerHTML = 
                "Rs." + total; 
        } 
 
    </script> 
 
</body> 
</html>
